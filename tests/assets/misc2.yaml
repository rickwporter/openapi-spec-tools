tags:
- name: admin
  description: Admin interface to delete stuff

paths:
  /something:
    delete:
      operationId: deleteSomething
      responses:
        '204':
          description: No body in this delete response.
    get:
      operationId: getSomething
      responses:
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    put:
      operationId: putSomething
      responses:
        '204':
          content:
            application/html:
              schema:
                $ref: '#/components/schemas/Pet'
    post:
      operationId: postSomething
      responses:
        '204':
          content:
            application/yaml:
              schema:
                $ref: '#/components/schemas/Pet'
  /something/else:
    delete:
      operationId: deleteSomethingElse
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    get:
      operationId: getSomethingElse
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  species:
                    type: string
    put:
      operationId: updateSomethingElse
      responses:
        '200':
          content:
            application/json:
              examples:
                note: This response has no schema
  /composed:
    get:
      operationId: getComposed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Wrapper'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Pet'
                      extra:
                        type: string
                      links:
                        allOf:
                          - $ref: '#/components/schemas/LinksPage'
  /composed/model:
    get:
      operationId: getComposedModel
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComposedPet'
                description: Custom pet
  /composed/loop:
    get:
      operationId: getComposedLoop
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoopA'
  /composed/missing:
    get:
      operationId: getMissingRef
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoesNotExist'


components:
  schemas:
    Pet:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    Foo:
      type: object
      properties:
        name:
          type: string
          nullable: true
      required:
      - name
    Wrapper:
      type: object
      description: A wrapper
      properties:
        data:
          description: Collection
          type: array
          items:
            type: object
        links:
          type: object
    LinksPage:
      type: object
      properties:
        next:
          type: string
    ComposedPet:
      description: Pet plus extra
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          required:
            - name
          properties:
            tag:
              type: string
      required:
        - tag
    LoopA:
      allOf:
        - $ref: '#/components/schemas/LoopB'
        - type: object
          properties:
            fromA:
              type: string
    LoopB:
      allOf:
        - $ref: '#/components/schemas/LoopA'
        - type: object
          properties:
            fromB:
              type: integer
