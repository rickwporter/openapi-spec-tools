        operationId: postComment
    -   name: delete
        operationId: deleteComment
    -   name: reactions
        subcommandId: files_comments_reactions
    -   name: show
        operationId: getComments
files_comments_reactions:
    description: Manage files comments reactions
    operations:
    -   name: create
        operationId: postCommentReaction
