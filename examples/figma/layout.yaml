main:
    description: This is the OpenAPI specification for the [Figma REST API](https://www.figma.com...
    operations:
    -   name: activity-logs
        operationId: getActivityLogs
    -   name: analytics
        subcommandId: analytics
    -   name: component-sets
        operationId: getComponentSet
    -   name: components
        operationId: getComponent
    -   name: dev-resources
        subcommandId: dev_resources
    -   name: files
        subcommandId: files
    -   name: images
        operationId: getImages
    -   name: me
        operationId: getMe
    -   name: payments
        operationId: getPayments
    -   name: projects
        subcommandId: projects
    -   name: styles
        operationId: getStyle
    -   name: teams
        subcommandId: teams
    -   name: webhooks
        subcommandId: webhooks
analytics:
    description: Manage analytics
    operations:
    -   name: libraries
        subcommandId: analytics_libraries
analytics_libraries:
    description: Manage analytics libraries
    operations:
    -   name: component
        subcommandId: analytics_libraries_component
    -   name: style
        subcommandId: analytics_libraries_style
    -   name: variable
        subcommandId: analytics_libraries_variable
analytics_libraries_component:
    description: Manage analytics libraries component
    operations:
    -   name: actions
        operationId: getLibraryAnalyticsComponentActions
    -   name: usages
        operationId: getLibraryAnalyticsComponentUsages
analytics_libraries_style:
    description: Manage analytics libraries style
    operations:
    -   name: actions
        operationId: getLibraryAnalyticsStyleActions
    -   name: usages
        operationId: getLibraryAnalyticsStyleUsages
analytics_libraries_variable:
    description: Manage analytics libraries variable
    operations:
    -   name: actions
        operationId: getLibraryAnalyticsVariableActions
    -   name: usages
        operationId: getLibraryAnalyticsVariableUsages
dev_resources:
    description: Manage dev-resources
    operations:
    -   name: create
        operationId: postDevResources
    -   name: set
        operationId: putDevResources
files:
    description: Manage files
    operations:
    -   name: comments
        subcommandId: files_comments
    -   name: component-sets
        operationId: getFileComponentSets
    -   name: components
        operationId: getFileComponents
    -   name: dev-resources
        subcommandId: files_dev_resources
    -   name: images
