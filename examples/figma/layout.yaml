        operationId: getTeamProjects
    -   name: styles
        operationId: getTeamStyles
    -   name: webhooks
        operationId: getTeamWebhooks
webhooks:
    description: Manage webhooks
    operations:
    -   name: create
        operationId: postWebhook
    -   name: delete
        operationId: deleteWebhook
    -   name: list
        operationId: getWebhooks
