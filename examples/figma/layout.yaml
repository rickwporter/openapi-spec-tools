        operationId: getCommentReactions
files_dev_resources:
    description: Manage files dev-resources
    operations:
    -   name: delete
        operationId: deleteDevResource
    -   name: show
        operationId: getDevResources
files_variables:
    description: Manage files variables
    operations:
    -   name: create
        operationId: postVariables
