[project]
name = "figma-cli"
version = "0.1.0"
description = "Generated CLI for interacting with Figma service"
authors = [
    {name = "Rick Porter",email = "rickwporter@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "typer (>=0.24.1,<0.25.0)",
    "rich (>=14.3.3,<15.0.0)",
    "rich-objects (>=0.2.3,<0.3.0)",
    "requests (>=2.32.5,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
openapi-spec-tools = {path = "../..", develop = true}
ruff = "^0.15.6"

[tool.poetry.scripts]
# this adds the main CLI function to allow calling directly from a shell
figma = "figma_cli.main:app"

[tool.ruff]
line-length = 250

[tool.ruff.lint.isort]
force-single-line = true
split-on-trailing-comma = true

[tool.ruff.lint.pylint]
max-args = 25
max-branches = 12
max-returns = 10
max-statements = 75

[tool.ruff.lint.per-file-ignores]
"*.py" = [
    "F401", # unused-imports: for Enum and sub-commands without any operations
    "F811", # redefined: happens for enums
]
