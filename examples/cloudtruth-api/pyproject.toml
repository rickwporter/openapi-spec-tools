[project]
name = "cloudtruth-api"
version = "0.1.0"
description = "Generated API code to manage CloudTruth service"
authors = [
    {name = "Rick Porter",email = "rickwporter@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.33.1"
pyyaml = "^6.0.3"

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.6"
black = "^26.3.1"
openapi-spec-tools = {path = "../..", develop = true}

[tool.ruff]
line-length = 150

[tool.ruff.lint.isort]
force-single-line = true
split-on-trailing-comma = true

[tool.ruff.lint.pylint]
max-args = 25
max-branches = 12
max-returns = 10
max-statements = 75
