[project]
name = "github-gen-cli"
version = "0.1.0"
description = "Generated GitHub CLI based on OpenAPI spec and layout file"
authors = [{ name = "Rick Porter", email = "rickwporter@gmail.com" }]
requires-python = ">=3.10,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "typer>=0.27.2",
    "rich>=15.0.0,<16",
    "requests>=2.33.1,<3",
    "pyyaml>=6.0.3,<7",
    "rich-objects>=0.3.0",
]

[project.scripts]
# this adds the main CLI function to allow calling directly from a shell
gh-cli = "github_gen_cli.main:app"

[dependency-groups]
dev = [
    "ruff>=0.15.6,<0.16",
    "black>=26.3.1,<27",
    "pytest>=9.0.2,<10",
    "coverage>=7.13.4,<8",
    "openapi-spec-tools",
]

[tool.uv]
default-groups = "all"

[tool.uv.sources]
openapi-spec-tools = { path = "../..", editable = true }

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 250

[tool.ruff.lint.isort]
force-single-line = true
split-on-trailing-comma = true

[tool.ruff.lint.pylint]
max-args = 25
max-branches = 12
max-returns = 10
max-statements = 75

[tool.ruff.lint.per-file-ignores]
"*.py" = [
    "F401", # unused-imports: for Enum and sub-commands without any operations
    "F811", # redefined: happens for enums
]
